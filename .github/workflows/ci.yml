name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # VITE_* are placeholders here — CI only proves the build compiles.
        # Real values are supplied as build args at deploy time (see DEPLOY.md).
        env:
          VITE_KIMI_AUTH_URL: https://auth.example.com
          VITE_APP_ID: ci-build
        run: npm run build
