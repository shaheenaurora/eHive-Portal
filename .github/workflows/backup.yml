name: Weekly database backup

# Safety-net backup for the production database (SRS NFR-OPS-02). Dumps the
# database weekly and stores it as a downloadable workflow artifact (90 days).
#
# DISABLED UNTIL CONFIGURED: this only does real work once you add a repository
# secret DATABASE_BACKUP_URL set to the MySQL connection URL. On Railway use the
# MySQL service's *public* URL (MYSQL_PUBLIC_URL), since GitHub's runners are
# outside Railway's network. Until the secret is set the job skips cleanly (it
# does NOT fail), so there are no failure emails while you're pre-launch.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup is configured
        id: cfg
        env:
          DB_URL: ${{ secrets.DATABASE_BACKUP_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::DATABASE_BACKUP_URL secret is not set — skipping backup. Add it (Railway MySQL public URL) to enable weekly backups."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MySQL client
        if: steps.cfg.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Dump database
        if: steps.cfg.outputs.configured == 'true'
        env:
          DB_URL: ${{ secrets.DATABASE_BACKUP_URL }}
        run: |
          # Parse mysql://user:pass@host:port/dbname
          rest=${DB_URL#mysql://}
          creds=${rest%@*}; hostpart=${rest#*@}
          DB_USER=${creds%%:*}; DB_PASS=${creds#*:}
          hostport=${hostpart%%/*}; DB_NAME=${hostpart#*/}; DB_NAME=${DB_NAME%%\?*}
          DB_HOST=${hostport%%:*}; DB_PORT=${hostport#*:}
          [ "$DB_PORT" = "$DB_HOST" ] && DB_PORT=3306
          STAMP=$(date -u +%Y%m%d-%H%M)
          MYSQL_PWD="$DB_PASS" mysqldump --single-transaction --no-tablespaces --routines \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" "$DB_NAME" > "ehive-$STAMP.sql"
          gzip "ehive-$STAMP.sql"

      - name: Upload backup artifact
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ehive-db-backup
          path: "*.sql.gz"
          retention-days: 90
